/* Settings app (Display + Data only for Phase 1) */
registerApp({
  id: "settings",
  name: "Settings",
  icon: function () { return icon("settings"); },
  open: function (root, params, ctx) {
    var unsubs = [];
    function destroy() {
      var i;
      for (i = 0; i < unsubs.length; i++) unsubs[i]();
    }
    function showRoot() {
      root.innerHTML = "";
      var header = h("div", { className: "app-header" });
      var back = h("button", { className: "back" });
      back.appendChild(icon("back"));
      back.addEventListener("click", function () { K.home(); }, false);
      header.appendChild(back);
      header.appendChild(h("div", { className: "title", text: "Settings" }));
      root.appendChild(header);
      var body = h("div", { className: "app-body" });
      var scroll = h("div", { className: "app-scroll scroll settings-list" });

      function row(label, val, onTap) {
        var r = h("div", { className: "settings-row" });
        r.appendChild(h("span", { text: label }));
        if (val) r.appendChild(h("span", { className: "val", text: val }));
        var ch = h("span", { className: "chev" });
        ch.appendChild(icon("chev"));
        r.appendChild(ch);
        r.addEventListener("click", onTap, false);
        return r;
      }
      scroll.appendChild(row("Display", "", function () { showDisplay(); }));
      scroll.appendChild(row("Data", "", function () { showData(); }));
      body.appendChild(scroll);
      root.appendChild(body);
    }

    function showDisplay() {
      root.innerHTML = "";
      var header = h("div", { className: "app-header" });
      var back = h("button", { className: "back" });
      back.appendChild(icon("back"));
      back.addEventListener("click", function () { showRoot(); }, false);
      header.appendChild(back);
      header.appendChild(h("div", { className: "title", text: "Display" }));
      root.appendChild(header);
      var body = h("div", { className: "app-body" });
      var scroll = h("div", { className: "app-scroll scroll" });

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "16px 0 8px" }, text: "Theme" }));
      var seg = h("div", { className: "seg-control" });
      var light = h("button", { className: store.settings.theme === "light" ? "active" : "", text: "Light" });
      var dark = h("button", { className: store.settings.theme === "dark" ? "active" : "", text: "Dark" });
      light.addEventListener("click", function () { store.settings.theme = "light"; saveStore(); applyTheme(); showDisplay(); }, false);
      dark.addEventListener("click", function () { store.settings.theme = "dark"; saveStore(); applyTheme(); showDisplay(); }, false);
      seg.appendChild(light);
      seg.appendChild(dark);
      scroll.appendChild(seg);

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "24px 0 8px" }, text: "Text size" }));
      var scales = [0.9, 1, 1.15, 1.3];
      var labels = ["Small", "Medium", "Large", "X-Large"];
      var si;
      for (si = 0; si < scales.length; si++) {
        (function (sc, lab) {
          var r = h("div", { className: "radio-row" });
          var rad = h("div", { className: "radio" + (store.settings.textScale === sc ? " on" : "") });
          r.appendChild(rad);
          r.appendChild(h("span", { text: lab }));
          r.addEventListener("click", function () {
            store.settings.textScale = sc;
            saveStore();
            applyTheme();
            showDisplay();
          }, false);
          scroll.appendChild(r);
        })(scales[si], labels[si]);
      }

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "24px 0 8px" }, text: "Clock" }));
      var seg2 = h("div", { className: "seg-control" });
      var b12 = h("button", { className: !store.settings.clock24 ? "active" : "", text: "12-hour" });
      var b24 = h("button", { className: store.settings.clock24 ? "active" : "", text: "24-hour" });
      b12.addEventListener("click", function () { store.settings.clock24 = false; saveStore(); showDisplay(); }, false);
      b24.addEventListener("click", function () { store.settings.clock24 = true; saveStore(); showDisplay(); }, false);
      seg2.appendChild(b12);
      seg2.appendChild(b24);
      scroll.appendChild(seg2);

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "24px 0 8px" }, text: "Week starts" }));
      var seg3 = h("div", { className: "seg-control" });
      var mon = h("button", { className: store.settings.weekStartsMonday ? "active" : "", text: "Monday" });
      var sun = h("button", { className: !store.settings.weekStartsMonday ? "active" : "", text: "Sunday" });
      mon.addEventListener("click", function () { store.settings.weekStartsMonday = true; saveStore(); K.emit("data"); showDisplay(); }, false);
      sun.addEventListener("click", function () { store.settings.weekStartsMonday = false; saveStore(); K.emit("data"); showDisplay(); }, false);
      seg3.appendChild(mon);
      seg3.appendChild(sun);
      scroll.appendChild(seg3);

      body.appendChild(scroll);
      root.appendChild(body);
    }

    function showData() {
      root.innerHTML = "";
      var header = h("div", { className: "app-header" });
      var back = h("button", { className: "back" });
      back.appendChild(icon("back"));
      back.addEventListener("click", function () { showRoot(); }, false);
      header.appendChild(back);
      header.appendChild(h("div", { className: "title", text: "Data" }));
      root.appendChild(header);
      var body = h("div", { className: "app-body" });
      var scroll = h("div", { className: "app-scroll scroll" });

      scroll.appendChild(h("div", { style: { fontSize: "20px", marginBottom: "12px" }, text: "Storage: " + (storageOk ? "Working" : "Unavailable (in-memory only)")));

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "20px 0 8px" }, text: "Export backup" }));
      var ta = h("textarea", { className: "export-area", readOnly: "readonly" });
      try {
        ta.value = JSON.stringify(store, function (k, v) { if (k && k.charAt(0) === "_") return undefined; return v; }, 2);
      } catch (e) { ta.value = "{}"; }
      scroll.appendChild(ta);
      var copyBtn = h("button", { className: "btn", text: "Select all", style: { marginTop: "8px", border: "1px solid var(--line)", borderRadius: "22px", padding: "10px 18px" } });
      copyBtn.addEventListener("click", function () {
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
      }, false);
      scroll.appendChild(copyBtn);

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "28px 0 8px" }, text: "Import backup" }));
      var imp = h("textarea", { className: "export-area", placeholder: "Paste JSON backup here" });
      scroll.appendChild(imp);
      var impBtn = h("button", { className: "btn primary", text: "Import", style: { marginTop: "8px", border: "1px solid var(--ink)", borderRadius: "22px", padding: "10px 18px", background: "var(--ink)", color: "var(--surface)" } });
      impBtn.addEventListener("click", function () {
        try {
          var data = JSON.parse(imp.value);
          if (!data || typeof data !== "object") throw new Error("bad");
          if (data.settings) store.settings = data.settings;
          if (data.events) store.events = data.events;
          if (data.countdowns) store.countdowns = data.countdowns;
          if (data.tasks) store.tasks = data.tasks;
          if (data.calendars) store.calendars = data.calendars;
          if (data.categories) store.categories = data.categories;
          store.ver = VERSION;
          saveStore(true);
          applyTheme();
          K.emit("data");
          K.emit("settings");
          showData();
        } catch (e) {
          imp.placeholder = "Invalid JSON — try again";
        }
      }, false);
      scroll.appendChild(impBtn);

      scroll.appendChild(h("div", { style: { fontSize: "16px", letterSpacing: "0.2em", textTransform: "uppercase", color: "var(--muted)", margin: "28px 0 8px" }, text: "Danger zone" }));
      var clearBtn = h("button", { className: "btn danger", text: "Clear everything", style: { border: "1px solid #B5524A", borderRadius: "22px", padding: "12px 18px", color: "#B5524A" } });
      clearBtn.addEventListener("click", function () {
        K.sheet(function (b) {
          b.appendChild(h("div", { className: "sheet-title", text: "Clear all data?" }));
          b.appendChild(h("div", { style: { fontSize: "22px", marginBottom: "16px" }, text: "This cannot be undone." }));
          var actions = h("div", { className: "sheet-actions" });
          var no = h("button", { className: "btn", text: "Cancel" });
          no.addEventListener("click", function () { closeSheet(); }, false);
          var yes = h("button", { className: "btn danger", text: "Clear" });
          yes.addEventListener("click", function () {
            store = JSON.parse(JSON.stringify(DEFAULTS));
            store.ver = VERSION;
            seedFirstRun();
            saveStore(true);
            applyTheme();
            K.emit("data");
            closeSheet();
            showData();
          }, false);
          actions.appendChild(no);
          actions.appendChild(yes);
          b.appendChild(actions);
        });
      }, false);
      scroll.appendChild(clearBtn);

      body.appendChild(scroll);
      root.appendChild(body);
    }

    showRoot();
    return { destroy: destroy };
  }
});

/* ---------- 10. Settings screens (handled inside Settings app) ---------- */

/* ---------- 11. Bootstrap ---------- */
function buildDock() {
  var dock = document.getElementById("dock");
  dock.innerHTML = "";
  var order = ["calendar", "tasks", "countdowns", "clock", "settings"];
  var i, app;
  for (i = 0; i < order.length; i++) {
    (function (id) {
      var a = null, j;
      for (j = 0; j < apps.length; j++) if (apps[j].id === id) { a = apps[j]; break; }
      if (!a) return;
      var item = h("button", { className: "dock-item" });
      var ic = h("div", { className: "icon" });
      ic.appendChild(a.icon());
      item.appendChild(ic);
      item.appendChild(h("div", { className: "label", text: a.name }));
      item.addEventListener("click", function () {
        var r = item.getBoundingClientRect();
        K.go(id, {}, r);
      }, false);
      dock.appendChild(item);
    })(order[i]);
  }
}

function showWelcome() {
  if (store.welcomed) return;
  K.sheet(function (body) {
    body.appendChild(h("div", { className: "sheet-title", text: "Welcome to WallOS" }));
    body.appendChild(h("div", { style: { fontSize: "22px", lineHeight: "1.4", marginBottom: "12px" }, text: "Tap a widget to open it. Swipe up from the bottom or use the Home button to return." }));
    body.appendChild(h("div", { style: { fontSize: "22px", lineHeight: "1.4", marginBottom: "12px" }, text: "Long-press an event to edit or delete it." }));
    body.appendChild(h("div", { style: { fontSize: "22px", lineHeight: "1.4", marginBottom: "20px" }, text: "Import calendars later from Settings → Calendars (Phase 3)." }));
    var actions = h("div", { className: "sheet-actions" });
    var ok = h("button", { className: "btn primary", text: "Got it" });
    ok.addEventListener("click", function () {
      store.welcomed = true;
      saveStore();
      closeSheet();
    }, false);
    actions.appendChild(ok);
    body.appendChild(actions);
  });
}

function bindGlobalGestures() {
  document.getElementById("btn-home").addEventListener("click", function () { K.home(); }, false);
  document.getElementById("sheet-mask").addEventListener("click", function () { closeSheet(); }, false);

  // prevent page scroll
  document.addEventListener("touchmove", function (ev) {
    var t = ev.target;
    var scrollable = false;
    while (t && t !== document) {
      if (t.classList && t.classList.contains("scroll")) { scrollable = true; break; }
      t = t.parentNode;
    }
    if (!scrollable) ev.preventDefault();
  }, { passive: false });

  // wake from ambient / night
  function wake(ev) {
    K.lastTouch = Date.now();
    if (K.state === "AMBIENT") {
      document.body.classList.remove("state-ambient");
      document.body.classList.add("state-home");
      K.state = "HOME";
      renderHome();
      if (ev) ev.stopPropagation();
    } else if (K.state === "NIGHT") {
      K.nightWakeUntil = Date.now() + 120000;
      document.body.classList.remove("state-night");
      document.body.classList.add("state-home");
      K.state = "HOME";
      renderHome();
      if (ev) ev.stopPropagation();
    }
  }
  document.getElementById("ambient").addEventListener("click", wake, false);
  document.getElementById("night").addEventListener("click", wake, false);

  // track any touch for idle
  document.addEventListener("touchstart", function () {
    K.lastTouch = Date.now();
  }, { passive: true });

  // visibility flush
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveStore(true);
  }, false);
  window.addEventListener("pagehide", function () { saveStore(true); }, false);
}

function start() {
  loadStore();
  applyTheme();
  updateStorageGlyph();
  buildDock();
  document.body.classList.add("state-home");
  K.state = "HOME";
  renderHome();
  bindGlobalGestures();

  // data-driven widget refresh
  K.on("data", function () {
    if (K.state === "HOME") renderHome();
  });
  K.on("minute", function () {
    if (K.state === "HOME") {
      // light refresh of today widget
      var wt = document.querySelector("#w-today .widget-body");
      if (wt) renderTodayWidget(wt.parentNode.querySelector(".widget-body") || wt);
    }
  });
  K.on("day", function () {
    if (K.state === "HOME") renderHome();
  });

  K.ticker = setInterval(tick, 1000);
  tick();

  setTimeout(function () { showWelcome(); }, 400);
}

start();
