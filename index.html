<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WallOS">
<meta name="format-detection" content="telephone=no">
<title>WallOS</title>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:300;background:#F2EFE8;color:#1C1A18}
*{box-sizing:border-box}
input,textarea{-webkit-user-select:text;font-size:22px;font-family:inherit}
button{font-family:inherit;border:none;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}

body{--bg:#F2EFE8;--surface:#F8F5EC;--ink:#1C1A18;--muted:#857A70;--accent:#A38A7B;--line:rgba(28,26,24,.14);--radius:28px;--radius-sm:14px;--safe-top:0px;--safe-bottom:0px;--safe-left:0px;--safe-right:0px;background:var(--bg);color:var(--ink);font-size:16px}
body.theme-dark{--bg:#14110F;--surface:#0B0B0B;--ink:#EFEAE0;--muted:#9A8F84;--accent:#B9A394;--line:rgba(239,234,224,.16)}
body.text-0{font-size:14.4px}body.text-1{font-size:16px}body.text-2{font-size:18.4px}body.text-3{font-size:20.8px}
@supports(padding:env(safe-area-inset-top)){body{--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--safe-left:env(safe-area-inset-left);--safe-right:env(safe-area-inset-right)}}

#root{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;max-width:1280px;margin:0 auto;background:var(--bg);overflow:hidden}
#status{height:calc(56px + var(--safe-top));padding:0 16px;padding-top:var(--safe-top);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;position:relative;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);-webkit-flex-shrink:0;flex-shrink:0}
#status .time{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:32px;font-weight:400;min-width:110px}
#status .date{position:absolute;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#status .right{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-width:110px;-webkit-justify-content:flex-end;justify-content:flex-end}
#status .glyph{width:28px;height:28px;margin-left:8px;color:var(--muted);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#status .home-btn{width:52px;height:52px;margin-left:8px;border-radius:50%;display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:var(--ink);border:1px solid var(--line)}
body.in-app #status .home-btn{display:-webkit-flex;display:flex}

#content{position:relative;-webkit-flex:1 1 auto;flex:1 1 auto;overflow:hidden;min-height:0}
#dock{height:calc(96px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;border-top:1px solid var(--line);background:var(--bg);-webkit-flex-shrink:0;flex-shrink:0;z-index:40}
body.in-app #dock{display:none}
.dock-item{width:96px;height:80px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:var(--ink);margin:0 4px}
.dock-item .icon{width:56px;height:56px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.dock-item .label{font-size:16px;margin-top:2px;color:var(--muted);letter-spacing:.05em}

/* Ambient – large clock as primary element */
#ambient{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:100;padding:24px}
body.state-ambient #ambient{display:-webkit-flex;display:flex}
body.state-ambient #status,body.state-ambient #content,body.state-ambient #dock{visibility:hidden}
#ambient .clock{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:240px;font-weight:400;line-height:.9;letter-spacing:-.03em}
#ambient .date{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:42px;margin-top:8px;color:var(--muted)}
#ambient .next{margin-top:28px;font-size:22px;color:var(--muted);max-width:80%;text-align:center}

#night{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:200;color:rgba(255,255,255,.15)}
body.state-night #night{display:-webkit-flex;display:flex}
body.state-night #status,body.state-night #content,body.state-night #dock,body.state-night #ambient{visibility:hidden}
#night .clock{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:180px;font-weight:400;line-height:1}

#home{position:absolute;top:0;left:0;right:0;bottom:0;padding:20px;display:none;overflow:hidden}
body.state-home #home,body.transitioning #home{display:block}
.widget{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;position:absolute}
.widget-title{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:32px;font-weight:400;margin:0;padding:14px 18px 6px}
.widget-body{padding:0 18px 14px}

/* Layout: Full */
#w-today{left:20px;top:20px;width:560px;height:calc(100% - 40px)}
#w-month{left:596px;top:20px;width:400px;height:320px}
#w-countdown{left:596px;top:356px;width:192px;height:220px}
#w-tasks{left:804px;top:356px;width:192px;height:220px}

@media(max-width:900px){
  #home{overflow-y:auto;-webkit-overflow-scrolling:touch}
  #w-today,#w-month,#w-countdown,#w-tasks{position:relative;left:auto!important;top:auto!important;width:100%!important;height:auto!important;margin-bottom:14px}
  #w-today{min-height:280px}
  #w-month{min-height:280px}
  #w-countdown,#w-tasks{min-height:160px;display:inline-block;width:48%!important}
}

#w-today .now-label{font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#w-today .now-title{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:44px;line-height:1.15;margin-bottom:2px}
#w-today .now-meta{font-size:20px;color:var(--muted);margin-bottom:12px}
#w-today .list-row{display:-webkit-flex;display:flex;padding:9px 0;border-top:1px solid var(--line);font-size:20px}
#w-today .list-time{width:86px;color:var(--muted);-webkit-flex-shrink:0;flex-shrink:0}
#w-today .empty{font-size:26px;color:var(--muted);padding-top:32px}

#w-month .month-name{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:28px;padding:12px 16px 6px}
#w-month .weekdays{display:-webkit-flex;display:flex;padding:0 10px;font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#w-month .weekdays span{-webkit-flex:1;flex:1;text-align:center}
#w-month .grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;padding:2px 10px 10px}
#w-month .day{width:14.28%;height:34px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:16px;position:relative}
#w-month .day.other{color:var(--muted);opacity:.5}
#w-month .day.today span.num{background:var(--ink);color:var(--surface);width:26px;height:26px;border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#w-month .dots{display:-webkit-flex;display:flex;height:5px;margin-top:1px}
#w-month .dot{width:4px;height:4px;border-radius:50%;margin:0 1px;background:var(--accent)}

#w-countdown .days{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:110px;line-height:1;text-align:center;padding-top:8px}
#w-countdown .name{font-size:18px;text-align:center;margin-top:2px;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#w-countdown .date{font-size:15px;color:var(--muted);text-align:center;margin-top:1px}
#w-countdown .empty{font-size:18px;color:var(--muted);text-align:center;padding-top:50px}

#w-tasks .task-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:6px 0;min-height:48px}
#w-tasks .check{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);margin-right:10px;-webkit-flex-shrink:0;flex-shrink:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:var(--ink)}
#w-tasks .check.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
#w-tasks .task-text{font-size:18px;-webkit-flex:1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#w-tasks .task-text.done{text-decoration:line-through;color:var(--muted)}
#w-tasks .all-done{font-size:20px;color:var(--muted);text-align:center;padding-top:36px}

.app-view{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;z-index:30;opacity:0;-webkit-transform:scale(.94);transform:scale(.94);-webkit-transition:opacity 280ms ease-out,-webkit-transform 280ms ease-out;transition:opacity 280ms ease-out,transform 280ms ease-out;pointer-events:none}
.app-view.open{opacity:1;-webkit-transform:scale(1);transform:scale(1);pointer-events:auto}
.app-view.closing{opacity:0;-webkit-transform:scale(.94);transform:scale(.94);pointer-events:none}
.app-header{height:64px;padding:0 14px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-bottom:1px solid var(--line);-webkit-flex-shrink:0;flex-shrink:0}
.app-header .back{width:52px;height:52px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin-right:6px;color:var(--ink)}
.app-header .title{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:42px;font-weight:400;-webkit-flex:1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-header .actions{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.app-header .btn{min-width:48px;height:42px;padding:0 12px;margin-left:5px;border:1px solid var(--line);border-radius:21px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.app-header .btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.app-body{-webkit-flex:1 1 auto;flex:1 1 auto;overflow:hidden;position:relative;min-height:0}
.app-scroll{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px}

.push-view{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-transform:translate3d(100%,0,0);transform:translate3d(100%,0,0);-webkit-transition:-webkit-transform 280ms ease-out;transition:transform 280ms ease-out;z-index:35}
.push-view.open{-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
.push-view.closing{-webkit-transform:translate3d(100%,0,0);transform:translate3d(100%,0,0)}

#sheet-mask{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;-webkit-transition:opacity 280ms ease-out;transition:opacity 280ms ease-out}
#sheet-mask.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;z-index:90;-webkit-transform:translate3d(0,100%,0);transform:translate3d(0,100%,0);-webkit-transition:-webkit-transform 280ms ease-out;transition:transform 280ms ease-out;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden}
#sheet.open{-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
#sheet .sheet-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 6px;-webkit-flex-shrink:0;flex-shrink:0}
#sheet .sheet-body{-webkit-flex:1 1 auto;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 22px 28px;min-height:0}
#sheet .sheet-title{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:34px;margin:0 0 14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input[type="text"],.field input[type="date"],.field input[type="time"],.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--ink);font-size:22px}
.field textarea{min-height:72px;resize:none}
.chips{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px}
.chip{padding:9px 14px;margin:4px;border:1px solid var(--line);border-radius:20px;font-size:17px;color:var(--ink);min-height:42px}
.chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sheet-actions{display:-webkit-flex;display:flex;-webkit-justify-content:flex-end;justify-content:flex-end;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.sheet-actions .btn{min-width:96px;height:46px;padding:0 18px;margin-left:8px;border:1px solid var(--line);border-radius:23px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.sheet-actions .btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sheet-actions .btn.danger{color:#B5524A;border-color:#B5524A}
.inline-msg{font-size:17px;color:#B5524A;margin-top:5px}

.cal-seg{display:-webkit-flex;display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-right:6px}
.cal-seg button{padding:7px 14px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:38px}
.cal-seg button.active{background:var(--ink);color:var(--surface)}
.month-grid-full{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;padding:6px 10px 20px}
.month-grid-full .cell{width:14.28%;height:68px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px;position:relative;font-size:16px}
.month-grid-full .cell:nth-child(7n){border-right:none}
.month-grid-full .cell.other{color:var(--muted);opacity:.45}
.month-grid-full .cell.today .num{background:var(--ink);color:var(--surface);width:26px;height:26px;border-radius:50%;display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.month-grid-full .cell .dots{display:-webkit-flex;display:flex;margin-top:2px}
.month-grid-full .cell .dot{width:5px;height:5px;border-radius:50%;margin-right:2px;background:var(--accent)}
.month-grid-full .cell .more{font-size:11px;color:var(--muted);margin-left:1px}

.day-allday{padding:6px 14px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;border-bottom:1px solid var(--line);min-height:36px}
.day-allday .pill{padding:5px 11px;margin:3px;border-radius:12px;font-size:16px;background:var(--accent);color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-timeline{position:relative;height:960px;margin-left:52px}
.day-timeline .hour-line{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.day-timeline .hour-label{position:absolute;left:-50px;width:46px;text-align:right;font-size:13px;color:var(--muted);-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.day-timeline .now-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:5}
.day-timeline .now-dot{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.day-timeline .ev-block{position:absolute;border-radius:7px;padding:3px 7px;overflow:hidden;font-size:16px;color:#fff;min-height:34px;z-index:2;border:1px solid rgba(255,255,255,.2)}
.day-timeline .ev-block .t{font-weight:400}

.settings-list{padding:0}
.settings-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-height:60px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:22px}
.settings-row .chev{margin-left:auto;color:var(--muted);width:26px;height:26px}
.settings-row .val{margin-left:auto;margin-right:10px;color:var(--muted);font-size:18px}
.seg-control{display:-webkit-flex;display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:6px 0}
.seg-control button{-webkit-flex:1;flex:1;padding:11px 6px;font-size:16px;color:var(--muted);min-height:44px}
.seg-control button.active{background:var(--ink);color:var(--surface)}
.radio-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-height:52px;padding:6px 0;font-size:20px}
.radio-row .radio{width:26px;height:26px;border:1.5px solid var(--line);border-radius:50%;margin-right:12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.radio-row .radio.on::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--ink)}
.export-area{width:100%;min-height:140px;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--ink);-webkit-user-select:text;font-family:monospace}

#toast{position:absolute;top:calc(56px + var(--safe-top));left:20px;right:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 16px;z-index:60;display:none}
#toast.show{display:block}
#toast .t-title{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:26px}
#toast .t-sub{font-size:17px;color:var(--muted);margin-top:1px}

.hidden{display:none!important}
.scroll{-webkit-overflow-scrolling:touch}
</style>
</head>

/* WallOS publishing build - Phase 1+2, bugs fixed, large clock */
